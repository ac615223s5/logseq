# Builds an unsigned iOS .ipa suitable for sideloading (AltStore/Sideloadly/TrollStore).
# No Apple signing secrets required.

name: Build-iOS-Unsigned

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "master"
      release-tag:
        description: "If set, also attach the IPA to this GitHub release tag"
        required: false
        default: ""

permissions:
  contents: write

env:
  CLOJURE_VERSION: '1.12.4.1618'
  NODE_VERSION: '24'
  JAVA_VERSION: '21'

jobs:
  build-app:
    runs-on: macos-26
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Show runtimes
        run: |
          xcrun simctl list > /dev/null

      - name: Install iOS platform
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "downloadPlatform attempt $i failed; retrying in 30s"
            sleep 30
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Set Build Environment Variables
        run: |
          echo "ENABLE_FILE_SYNC_PRODUCTION=true" >> $GITHUB_ENV

      - name: Compile CLJS
        run: pnpm install --frozen-lockfile && pnpm release-mobile

      - name: Prepare iOS build
        run: pnpm exec cap sync ios

      - name: Verify iOS web fonts
        run: pnpm test:ios-web-fonts

      - name: Build unsigned archive
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme Logseq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Logseq.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        id: ipa
        working-directory: ./ios/App
        run: |
          APP=$(ls -d build/Logseq.xcarchive/Products/Applications/*.app | head -1)
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          IPA="Logseq-ios-${VER}-unsigned.ipa"
          (cd build && zip -qry "$IPA" Payload)
          echo "ipa-path=ios/App/build/$IPA" >> $GITHUB_OUTPUT
          echo "ipa-name=$IPA" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.ipa-name }}
          path: ${{ steps.ipa.outputs.ipa-path }}
          retention-days: 30

      - name: Attach IPA to release
        if: ${{ github.event.inputs.release-tag != '' }}
        run: gh release upload "${{ github.event.inputs.release-tag }}" "${{ steps.ipa.outputs.ipa-path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
